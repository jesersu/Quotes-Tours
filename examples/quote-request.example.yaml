# Example quote request with invented values. Real requests go in data/private/quotes/
# (git-ignored). Build one with: quotes quote build <request.yaml>
client: Smith family
title: Colca Canyon, 2 days
language: en            # es (default) or en
date: 2026-10-14        # optional; default is today
signed_by: Sales team
# Optional: needs_review (true/false) and review_hints (list of text) mark a draft written by the
# planner. `quote build` refuses a request with needs_review: true; set it to false once reviewed.
days: 2
travelers:
  adults: 2
  child_ages: [8]       # optional
pricing:
  margin_rate: "0.25"   # required; a plain YAML number is read as text too, never as a float
  fx_rate: "3.5"        # optional, default 3.5
  usd_rounding_step: "5"  # optional, default none
# One quote with a single programme uses top-level `items` and `extras` (below). To offer several
# programmes in the same document, drop them and list `options` instead. Travelers, pricing and
# paid_locally are shared; `days` above is the default for an option without its own `days`.
#
# options:
#   - label: Option 1
#     subtitle: Ends in Puno   # optional
#     days: 3                  # optional, defaults to the request days
#     itinerary:               # optional, belongs to this option
#       - day: 1
#         title: Arequipa - Puno
#     items:
#       - id: van
#     extras:                  # optional, belongs to this option
#       - label: Horseback ride
#         items:
#           - id: horse
#   - label: Option 2          # labels must be unique
#     items:
#       - id: van
#       - id: guide
# Optional day titles. With `on_days` on an item or any title here, the document adds an
# itinerary section: for each day, your title and the names of the services placed on it.
itinerary:
  - day: 1
    title: Arequipa - Chivay
  - day: 2
    title: Colca Canyon - Arequipa
items:
  - id: van
  - id: guide
    days: 1             # optional, overrides the request days for this item
    on_days: [1]        # optional, places the item on these days of the itinerary
  - id: bus-seat
    quantity: 3         # optional, for per-unit items
extras:                 # optional
  - label: Horseback ride
    items:
      - id: horse
paid_locally: [colca-ticket]   # optional
